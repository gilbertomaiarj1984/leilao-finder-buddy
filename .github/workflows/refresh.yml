name: Atualização periódica dos lotes

# Roda 2x por dia (UTC 03:10/17:00 = BRT 00:10/14:00). Também pode ser disparado
# manualmente na aba Actions ("Run workflow"). O "Atualizar tudo" no app continua
# existindo para forçar na hora.
on:
  schedule:
    - cron: "10 3,17 * * *"
  workflow_dispatch: {}

concurrency:
  group: refresh-lotes
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Varrer em blocos + preencher nº de lote
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_TOKEN: ${{ secrets.CRON_TOKEN }}
          # Fase 5 da migração para VPS (docs/economia-fase-2-vps-unico.md). OPCIONAL: sem
          # este secret, os pings viram no-op (curl nem roda) — nada quebra. Crie um check
          # em https://healthchecks.io (free), tipo "Cron", período ~13h de folga sobre as
          # 12h entre execuções, e cole a "Ping URL" aqui.
          HEALTHCHECKS_PING_URL: ${{ secrets.HEALTHCHECKS_PING_URL }}
        run: |
          set -euo pipefail
          if [ -z "${APP_URL:-}" ] || [ -z "${CRON_TOKEN:-}" ]; then
            echo "Configure os secrets APP_URL e CRON_TOKEN no repositório."; exit 1
          fi
          base="${APP_URL%/}"
          call() { curl -fsS --max-time 120 --retry 3 --retry-delay 5 -H "x-cron-token: $CRON_TOKEN" "$base$1"; }
          # Avisa o healthchecks.io se a execução falhar (falha silenciosa é o risco nº 1 do
          # cron — ver "Riscos e reversão" no plano de migração); ping de sucesso no final.
          ping_healthcheck() {
            [ -z "${HEALTHCHECKS_PING_URL:-}" ] && return 0
            curl -fsS --retry 2 --max-time 10 "${HEALTHCHECKS_PING_URL%/}${1:+/$1}" >/dev/null || true
          }
          trap 'ping_healthcheck fail' ERR

          echo "== Varredura em blocos =="
          # `chunk`/`enrich` engolem falha de persistência no banco (best-effort, pra não
          # derrubar a varredura por um blipe transitório de rede) e sempre voltam HTTP 200 —
          # por isso `call()` (que usa `curl -f`) nunca detectava um banco fora do ar aqui,
          # mascarando perda silenciosa de lotes (ex.: cron rodando contra ambiente sem
          # DATABASE_URL). O campo `persisted:false` na resposta agora expõe isso: aborta a
          # run (mesmo padrão do trap ERR) em vez de seguir raspando sem nunca gravar nada.
          from="null"
          for i in $(seq 1 80); do
            res="$(call "/api/cron?step=chunk&fromPage=$from&size=15")"
            echo "chunk $i: $res"
            if [ "$(echo "$res" | jq -r '.persisted')" = "false" ]; then
              echo "chunk $i: persisted=false — banco não gravou o bloco, abortando"
              ping_healthcheck fail; exit 1
            fi
            next="$(echo "$res" | jq -r '.nextPage')"
            [ "$next" = "null" ] && break
            from="$next"
          done

          echo "== Descoberta por galeria (categorização da casa não bate com tp= da LeilõesBR) =="
          # Fecha o gap achado v0.69.31-37 (notas-desenvolvimento.md, Pendências): a categoria
          # "Disco de Vinil" que `chunk` acima usa (`tp=`) não bate com a marcação de TODAS as
          # casas — algumas ficam de fora da varredura geral por completo, mesmo com itens
          # saudáveis na LeilõesBR. `step=galleryscan` varre cada "galeria" (casa) listada por
          # `busca_andamento.asp?tp=<vinil>` direto por `ga=<código>` (sem travar `tp=`),
          # filtrando por TÍTULO em vez de categoria da plataforma — mesmo formato de VinylLot
          # completo da varredura geral, upsert de sempre. Roda ANTES do `enrich` abaixo de
          # propósito: os lotes recém-descobertos aqui já entram na mesma passada de nº de lote.
          off=0
          for i in $(seq 1 25); do
            res="$(call "/api/cron?step=galleryscan&offset=$off&count=3")"
            echo "galleryscan $i (offset $off): $res"
            if [ "$(echo "$res" | jq -r '.persisted')" = "false" ]; then
              echo "galleryscan $i: persisted=false — banco não gravou o bloco, abortando"
              ping_healthcheck fail; exit 1
            fi
            done="$(echo "$res" | jq -r '.done')"
            [ "$done" = "true" ] && break
            off="$(echo "$res" | jq -r '.nextOffset')"
            [ "$off" = "null" ] && break
          done

          echo "== Preenchimento de nº de lote (catálogos) =="
          off=0
          for i in $(seq 1 60); do
            res="$(call "/api/cron?step=enrich&max=6&offset=$off")"
            echo "enrich $i (offset $off): $res"
            if [ "$(echo "$res" | jq -r '.persisted')" = "false" ]; then
              echo "enrich $i: persisted=false — banco não gravou os nº de lote, abortando"
              ping_healthcheck fail; exit 1
            fi
            done="$(echo "$res" | jq -r '.done')"
            [ "$done" = "true" ] && break
            off="$(echo "$res" | jq -r '.nextOffset')"
            [ "$off" = "null" ] && break
          done

          echo "== Avaliação da IA (assíncrona, Batches) =="
          # Cada chamada coleta o batch anterior e/ou submete o próximo. O batch pode
          # levar minutos; se ainda estiver processando, a próxima execução 6-horária
          # coleta. Aqui damos algumas voltas com espera para tentar submeter e já
          # coletar na mesma run. No-op se ANTHROPIC_API_KEY não estiver configurado.
          for i in $(seq 1 5); do
            res="$(call "/api/cron?step=aieval")"
            echo "aieval $i: $res"
            if echo "$res" | jq -e '.skipped' >/dev/null 2>&1; then break; fi
            if echo "$res" | jq -e '.done == true' >/dev/null 2>&1; then break; fi
            sleep 60
          done

          echo "== Identificação simplificada (artista/álbum, Batches) =="
          # Camada barata que roda para TODOS os lotes (independente do modo da avaliação
          # completa): 1ª passada só por título; escala para a capa nos de baixa confiança.
          # Alimenta exibição/busca/filtro por artista e o Discogs (por isso vem ANTES do
          # market). Idempotente por chamada; no-op sem ANTHROPIC_API_KEY.
          for i in $(seq 1 5); do
            res="$(call "/api/cron?step=aiident")"
            echo "aiident $i: $res"
            if echo "$res" | jq -e '.skipped' >/dev/null 2>&1; then break; fi
            if echo "$res" | jq -e '.done == true' >/dev/null 2>&1; then break; fi
            sleep 60
          done

          echo "== Âncora de mercado (Discogs) =="
          # Cada chamada consulta um bloco de lotes (throttle interno ~1req/s, respeitando
          # o rate limit). Chunked: repetimos até done=true ou acabar as iterações; o resto
          # completa nas execuções seguintes. No-op sem DISCOGS_TOKEN.
          for i in $(seq 1 12); do
            res="$(call "/api/cron?step=market&max=12")"
            echo "market $i: $res"
            if echo "$res" | jq -e '.skipped' >/dev/null 2>&1; then break; fi
            if echo "$res" | jq -e '.done == true' >/dev/null 2>&1; then break; fi
          done

          echo "== Estado (Disco/Capa) dos lotes pré-leilão (lot_condition) =="
          # Busca o catálogo da casa (1 req/leilão) e parseia o descritivo do card (tooltip)
          # para gravar o estado por lote. Chunked (drena por rodada): repetimos até done=true.
          for i in $(seq 1 40); do
            res="$(call "/api/cron?step=condition&max=8")"
            echo "condition $i: $res"
            if echo "$res" | jq -e '.done == true' >/dev/null 2>&1; then break; fi
          done

          echo "== Diagnóstico de vendas (salesdebug — sinais crus do catálogo, não grava) =="
          # Mostra, para os leilões terminados, quantos lotes o parser vê e reconhece como
          # vendidos, e se o HTML traz "Valor de venda"/"vendido". Ajuda a distinguir um
          # sales:0 legítimo (casa sem venda) de um parser que não casou o formato da casa.
          call "/api/cron?step=salesdebug&limit=5" | jq . || true

          echo "== Captura de vendas pós-leilão (histórico lot_sales) =="
          # Varre o catálogo da casa (1 req/leilão) dos leilões terminados ainda não
          # capturados e grava o valor de venda + estado. Chunked (cursor no servidor):
          # repetimos até done=true; o resto completa nas execuções seguintes. Também
          # faz o backfill do que já está na base.
          for i in $(seq 1 40); do
            res="$(call "/api/cron?step=sales&max=8")"
            echo "sales $i: $res"
            if echo "$res" | jq -e '.done == true' >/dev/null 2>&1; then break; fi
          done

          echo "== Reidentificação por IA de TODO o histórico (artista/álbum + padronização) =="
          # Passa a IA (título + descrição → "Artista - Álbum") pelas vendas ainda não
          # identificadas (via RPC de anti-join no banco, não baixa mais as tabelas inteiras) e
          # PADRONIZA a grafia dos nomes (evita registros duplicados por diferenças mínimas).
          # Chunked: repetimos até done=true; o resto completa nas execuções seguintes. Em regime
          # (sem backlog grande) converge em 1-2 chamadas — 15 é folga, não o caminho comum. Sem
          # provedor de IA, só a padronização roda.
          for i in $(seq 1 15); do
            res="$(call "/api/cron?step=reident&max=25")"
            echo "reident $i: $res"
            if echo "$res" | jq -e '.done == true' >/dev/null 2>&1; then break; fi
          done

          echo "== Sincronização de compras (vinil, menu Compras) =="
          # Descobre leilões vencidos pelos lances (l=4) e varre só esses (l=6&id=<idLeilao>),
          # upsert por lot_id — 1 chamada por rodada, sem paginação cega.
          res="$(call "/api/cron?step=purchases")"
          echo "purchases: $res"

          echo "== Faxina de seen_auctions (Fase 5 da migração para VPS) =="
          # Remove leilões cujas vendas já foram capturadas e fora da janela de retenção —
          # tabela nunca era podada antes, só crescia. 1 chamada, idempotente.
          res="$(call "/api/cron?step=prune")"
          echo "prune: $res"

          echo "Concluído."
          ping_healthcheck
