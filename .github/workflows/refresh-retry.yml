name: Reexecutar atualização com falha

# Se o "Atualização periódica dos lotes" terminar em falha, reexecuta os jobs que falharam
# UMA vez (run_attempt < 2) — os steps são idempotentes/chunked, então a repetição só
# completa o que faltou. Só dispara para runs agendadas ou manuais, nunca em loop.
on:
  workflow_run:
    workflows: ["Atualização periódica dos lotes"]
    types: [completed]

permissions:
  actions: write

jobs:
  retry:
    if: ${{ github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.run_attempt < 2 }}
    runs-on: ubuntu-latest
    steps:
      - name: Reexecutar jobs que falharam
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run rerun ${{ github.event.workflow_run.id }} --failed --repo ${{ github.repository }}
