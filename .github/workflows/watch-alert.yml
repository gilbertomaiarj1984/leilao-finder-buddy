name: Aviso de pregão começando

# A cada 15 minutos entre 6h e 23h45 de Brasília (UTC 9h–02h45; o agendador do GitHub pode atrasar
# alguns minutos). Só chama o endpoint — o servidor decide: avisa por Web Push quando o pregão de um
# lote vigiado começa em até 30 min (uma vez por lote vigiado) e quando um lote vigiado cruza o teto
# de lance (barato), e é no-op sem VAPID_* ou sem aparelho inscrito. Fora do grupo de concorrência das varreduras (`refresh-lotes`) para não enfileirar atrás
# delas. Também pode ser disparado manualmente.
on:
  schedule:
    - cron: "*/15 9-23,0-2 * * *"
  workflow_dispatch: {}

concurrency:
  group: watch-alert
  cancel-in-progress: true

jobs:
  alert:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Avisar pregões vigiados que estão para começar
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_TOKEN: ${{ secrets.CRON_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${APP_URL:-}" ] || [ -z "${CRON_TOKEN:-}" ]; then
            echo "Configure os secrets APP_URL e CRON_TOKEN no repositório."; exit 1
          fi
          curl -fsS --max-time 120 --retry 2 --retry-delay 5 \
            -H "x-cron-token: $CRON_TOKEN" "${APP_URL%/}/api/cron?step=watchalert"
