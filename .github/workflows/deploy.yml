name: Deploy (VPS)

# Fases 4/5 da migração para VPS (docs/economia-fase-2-vps-unico.md). Builda as imagens
# (app + backup) no Actions (não no VPS — 2 vCPU/4 GB aguentaria, mas builda fora deixa o
# deploy rápido e reproduzível), publica no GHCR e faz o VPS puxar. Dispara em push pra
# `vps` OU `main` — pós-cutover da Fase 6 (`main` sincronizado com `vps`), qualquer PR
# mesclado numa das duas já reflete em produção; `vps` continua existindo em paralelo
# enquanto durar trabalho experimental lá (ex.: Fase 7/preview deployments) sem tocar
# `main` ainda.

on:
  push:
    branches: [vps, main]
    paths-ignore:
      - "docs/**"
      - "**.md"
  workflow_dispatch: {}

concurrency:
  group: deploy-vps
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}
  BACKUP_IMAGE: ghcr.io/${{ github.repository }}-backup

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # O driver `docker` padrão do runner hospedado não suporta `cache-to: type=gha`
      # ("Cache export is not supported for the docker driver") — precisa do driver
      # `docker-container`, que este passo configura.
      - name: Configurar Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e push da imagem do app
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build e push da imagem de backup (Fase 5)
        uses: docker/build-push-action@v6
        with:
          context: ./docker/backup
          push: true
          tags: |
            ${{ env.BACKUP_IMAGE }}:latest
            ${{ env.BACKUP_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=backup
          cache-to: type=gha,mode=max,scope=backup

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar chave SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Copiar compose/Caddyfile para o VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH }}
          VPS_SSH_PORT: ${{ secrets.VPS_SSH_PORT }}
        run: |
          set -euo pipefail
          port="${VPS_SSH_PORT:-22}"
          mkdir -p ~/.ssh
          ssh-keyscan -p "$port" -H "$VPS_HOST" >> ~/.ssh/known_hosts
          ssh -p "$port" "$VPS_USER@$VPS_HOST" "mkdir -p '$VPS_DEPLOY_PATH/supabase-init'"
          scp -P "$port" docker-compose.yml Caddyfile "$VPS_USER@$VPS_HOST:$VPS_DEPLOY_PATH/"
          # Só roda de fato num volume de dados novo (postgres:17-alpine, initdb.d) — não
          # afeta um banco já existente. Nome com prefixo numérico: initdb.d roda em ordem
          # alfabética, e supabase/setup.sql é re-executável (tudo IF NOT EXISTS).
          scp -P "$port" supabase/setup.sql "$VPS_USER@$VPS_HOST:$VPS_DEPLOY_PATH/supabase-init/01-setup.sql"

      - name: Deploy (pull + up -d)
        # `docker compose up -d` NÃO recria/reinicia um serviço só porque o CONTEÚDO de um
        # arquivo montado via bind mount mudou (o Caddyfile é montado assim) — Compose decide
        # recriar comparando a definição do serviço no compose file, não o conteúdo dos
        # volumes. Mesma classe de bug já vista neste projeto (v0.69.5/v0.69.8: `.env`
        # mudou e precisou de `--force-recreate` na mão). Achado investigando por que o header
        # `X-Debug-Upstream` (v0.69.21) nunca aparecia mesmo depois do deploy — o Caddy seguia
        # rodando a config ANTIGA. `caddy reload` recarrega a config em tempo real (zero
        # downtime, sem derrubar conexões), então todo deploy garante o Caddyfile atualizado
        # de verdade, não só copiado pro disco.
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH }}
          VPS_SSH_PORT: ${{ secrets.VPS_SSH_PORT }}
          APP_IMAGE: ${{ env.IMAGE }}:${{ github.sha }}
          BACKUP_IMAGE: ${{ env.BACKUP_IMAGE }}:${{ github.sha }}
        run: |
          set -euo pipefail
          port="${VPS_SSH_PORT:-22}"
          ssh -p "$port" "$VPS_USER@$VPS_HOST" "cd '$VPS_DEPLOY_PATH' && \
            export APP_IMAGE='$APP_IMAGE' BACKUP_IMAGE='$BACKUP_IMAGE' && \
            docker compose pull && \
            docker compose up -d --remove-orphans && \
            docker compose exec -T postgres sh -c 'psql -U \"\$POSTGRES_USER\" -d \"\$POSTGRES_DB\" -v ON_ERROR_STOP=1 -f /docker-entrypoint-initdb.d/01-setup.sql' && \
            docker compose exec -T caddy caddy reload --config /etc/caddy/Caddyfile --adapter caddyfile"
